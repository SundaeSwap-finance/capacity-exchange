version: '3'

# Internal build tasks — TypeScript package build dependency graph and shared tooling.
# Included by root Taskfile.yml under the _build namespace.

tasks:
  # --- Bootstrap ---

  install:
    run: once
    cmds:
      - bun install

  compile-contracts:
    run: once
    deps: [install]
    cmds:
      - bun run compile

  # --- TypeScript ---
  # The package graph lives in tsconfig project references (see tsconfig.build.json), so
  # these tasks only sequence non-TypeScript prerequisites. Don't run separate `tsc -b`
  # invocations in parallel: they would rebuild shared dependencies concurrently.

  typescript:
    run: once
    deps: [install, compile-contracts]
    cmds:
      - bun run build

  # Narrow target for tasks that only need the node runtime and shouldn't compile contracts.
  midnight-node:
    run: once
    deps: [install]
    cmds:
      - bun run --filter @sundaeswap/capacity-exchange-nodejs build

  # Network-agnostic: the bundle's network is filled in at deploy by the demo's interpolate-index.
  webapp:
    deps: [typescript]
    cmds:
      - bun run --filter @capacity-exchange/demo build

  build-all:
    cmds:
      - task: webapp
